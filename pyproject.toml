[project]
name = "everyday-survey"
version = "0.1.0"
description = "AI Daily Survey Web Application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "google-genai>=1.0.0",
    "apscheduler>=3.10.4",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "markdown>=3.7",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "praw>=7.8.1",
    "python-dotenv>=1.0.1",
    "pytz>=2024.2",
    "aiosmtplib>=3.0.1",
    "greenlet>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pre-commit>=4.5.1",
    "poethepoet>=0.42.1",
    "ruff>=0.15.5",
    "mypy>=1.19.1",
    "types-pytz>=2026.1.1.20260304",
    "types-markdown>=3.10.2.20260211",
]
tts = [
    "kokoro-onnx>=0.5.0",
    "soundfile>=0.14.0",
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.poe.tasks]
format = "uv run ruff format ."
lint = "uv run ruff check --fix ."
type-check = "uv run mypy ."

check = ["format", "lint", "type-check"]
