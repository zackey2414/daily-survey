<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Daily Survey{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗞️</text></svg>">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <!-- Alpine.js -->
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('dailyChat', {
        open: false,
        loaded: false,
        dateStr: '',
        _updateBodyScroll(isOpen) {
          // モバイル（lg未満）でチャットオープン時はbodyスクロールをロック
          if (window.innerWidth < 1024 && isOpen) {
            document.body.style.overflow = 'hidden';
          } else {
            document.body.style.overflow = '';
          }
        },
        toggle(dateStr) {
          if (this.open) { this.open = false; this._updateBodyScroll(false); return; }
          var needLoad = !this.loaded || this.dateStr !== dateStr;
          this.dateStr = dateStr;
          this.open = true;
          this._updateBodyScroll(true);
          if (needLoad) {
            this.loaded = true;
            var url = '/daily-chat/' + dateStr + '/sessions/latest';
            // 画面幅に応じて1つのパネルにのみ読み込む（二重リクエスト防止）
            if (window.innerWidth >= 1024) {
              var desktop = document.getElementById('daily-chat-panel');
              if (desktop) htmx.ajax('GET', url, {target: '#daily-chat-panel', swap: 'innerHTML'});
            } else {
              var mobile = document.getElementById('daily-chat-panel-mobile');
              if (mobile) htmx.ajax('GET', url, {target: '#daily-chat-panel-mobile', swap: 'innerHTML'});
            }
          }
        }
      });

      // dailyChat.open の変更を監視してスクロールロック・スティッキーバー位置を同期
      Alpine.effect(() => {
        var store = Alpine.store('dailyChat');
        if (store) {
          store._updateBodyScroll(store.open);
          // スティッキーバーの right 位置を更新
          var bar = document.getElementById('section-sticky-bar');
          if (bar) {
            bar.style.right = (store.open && window.innerWidth >= 1024) ? '420px' : '0';
          }
        }
      });
      // リサイズ時にもスクロールロック状態を再評価
      window.addEventListener('resize', () => {
        var store = Alpine.store('dailyChat');
        if (store) store._updateBodyScroll(store.open);
      });
    });
  </script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    *, body { font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif; }
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f1f5f9;
    }
    [x-cloak] { display: none !important; }

    /* カードホバー */
    .card {
      transition: transform 0.18s cubic-bezier(.22,.68,0,1.2), box-shadow 0.18s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    /* Prose スタイル */
    .prose h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    .prose h2 { font-size: 1.15rem; font-weight: 700; margin: 1.5rem 0 0.5rem; color: #1e40af; border-bottom: 1px solid #dbeafe; padding-bottom: 0.3rem; }
    .prose h3 { font-size: 1.0rem; font-weight: 600; margin: 1rem 0 0.3rem; color: #374151; }
    .prose ul { list-style: disc; padding-left: 1.5rem; }
    .prose ol { list-style: decimal; padding-left: 1.5rem; }
    .prose li { margin-bottom: 0.35rem; line-height: 1.75; }
    .prose p { margin-bottom: 0.8rem; line-height: 1.85; }
    .prose strong { font-weight: 700; color: #111827; }
    .prose a { color: #2563eb; text-decoration: underline; text-decoration-color: #bfdbfe; text-underline-offset: 2px; transition: text-decoration-color 0.15s; }
    .prose a:hover { text-decoration-color: #2563eb; }
    .prose code { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 4px; padding: 0.1em 0.35em; font-size: 0.85em; color: #475569; word-break: break-all; }
    .prose pre { overflow-x: auto; max-width: 100%; }
    .prose blockquote { border-left: 3px solid #c7d2fe; padding-left: 1rem; color: #6b7280; margin: 0.75rem 0; font-style: italic; }
    .prose img, .prose table { max-width: 100%; overflow-x: auto; display: block; }

    /* チャット（記事カード内埋め込み用） */
    .card .chat-messages { max-height: 400px; overflow-y: auto; }
    /* 日毎チャットパネルではflex-1で全高さを使う */
    #daily-chat-container .chat-messages { max-height: none; }

    /* アニメーション */
    [x-show] { transition-property: opacity, transform; }
  </style>
</head>

<!-- セクションスティッキーブロック: 元のトグルボタンをクローンして上部からスライドイン -->
<script>
(function () {
  var stickyWrap = null;
  var NAV_H = 52;

  function createWrap() {
    stickyWrap = document.createElement('div');
    stickyWrap.id = 'section-sticky-bar';
    stickyWrap.style.cssText = [
      'position:fixed',
      'top:' + NAV_H + 'px',
      'left:0',
      'right:0',
      'z-index:40',
      'pointer-events:none',
      'transform:translateY(-110%)',
      'opacity:0',
    ].join(';');
    document.body.appendChild(stickyWrap);
  }

  // animated=false: 瞬時表示（sticky演出用）
  function show() {
    stickyWrap.style.transition = 'none';
    stickyWrap.style.transform = 'translateY(0)';
    stickyWrap.style.opacity = '1';
    stickyWrap.style.pointerEvents = 'auto';
  }

  // animated=true: スライドアウト（次セクション接近時）/ false: 瞬時非表示（スクロール戻り時）
  function hide(animated) {
    if (animated) {
      stickyWrap.style.transition = 'transform 0.32s cubic-bezier(0.22,1,0.36,1), opacity 0.22s ease';
    } else {
      stickyWrap.style.transition = 'none';
    }
    stickyWrap.style.transform = 'translateY(-110%)';
    stickyWrap.style.opacity = '0';
    stickyWrap.style.pointerEvents = 'none';
  }

  function isVisible(el) {
    var p = el.parentElement;
    while (p && p !== document.body) {
      if (getComputedStyle(p).display === 'none') return false;
      p = p.parentElement;
    }
    return true;
  }

  function closeSection(sEl) {
    try { Alpine.$data(sEl).open = false; } catch (e) {}
    sEl.querySelectorAll('section[data-section-title]').forEach(function (child) {
      try { Alpine.$data(child).open = false; } catch (e) {}
    });
  }

  // 元のボタンをクローンして Alpine ディレクティブを除去・矢印を ▲ に固定
  function cloneBtn(sEl) {
    var orig = sEl.querySelector(':scope > button');
    if (!orig) return null;
    var clone = orig.cloneNode(true);
    // 矢印スパンを ▲ 固定（クリックで閉じるので常に ▲）
    var arrow = clone.querySelector('[x-text]');
    if (arrow) arrow.textContent = '▲';
    // Alpine / イベントディレクティブを除去
    [clone].concat(Array.from(clone.querySelectorAll('*'))).forEach(function (el) {
      Array.from(el.attributes).slice().forEach(function (a) {
        if (a.name.startsWith('x-') || a.name.startsWith('@')) el.removeAttribute(a.name);
      });
    });
    clone.style.width = '100%';
    clone.style.display = 'flex';
    return clone;
  }

  function updateStickyRight() {
    if (!stickyWrap || !window.Alpine) return;
    var chatOpen = Alpine.store('dailyChat') && Alpine.store('dailyChat').open;
    stickyWrap.style.right = (chatOpen && window.innerWidth >= 1024) ? '420px' : '0';
  }

  function updateBar() {
    if (!stickyWrap || !window.Alpine) return;
    updateStickyRight();

    var sections = Array.from(document.querySelectorAll('section[data-section-title]'));

    var active = sections.filter(function (s) {
      var d = null;
      try { d = Alpine.$data(s); } catch (e) { return false; }
      if (!d || !d.open) return false;
      if (!isVisible(s)) return false;
      var btn = s.querySelector(':scope > button');
      if (!btn) return false;
      // サブセクションは親セクションのボタン高さぶん下を基準にする
      var threshold = NAV_H;
      var p = s.parentElement;
      while (p && p !== document.body) {
        if (p.tagName === 'SECTION' && p.hasAttribute('data-section-title')) {
          var parentBtn = p.querySelector(':scope > button');
          if (parentBtn) threshold += parentBtn.offsetHeight + 4;
          break;
        }
        p = p.parentElement;
      }
      return btn.getBoundingClientRect().top < threshold;
    });

    if (active.length === 0) { hide(false); return; }  // スクロール戻り: 瞬時非表示

    // DOM で最後の active = 現在ユーザーがいるセクション
    var current = active[active.length - 1];
    // current 自身 + current の DOM 祖先のみ（兄弟は除外）
    var chain = active.filter(function (s) { return s === current || s.contains(current); });

    var key = chain.map(function (s) { return s.id; }).join('|');

    // コンテンツが変わった場合のみ再構築
    if (stickyWrap.dataset.activeKey !== key) {
      stickyWrap.dataset.activeKey = key;

      // メインコンテンツと同幅になるよう main の padding を参照
      var mainEl = document.querySelector('main');
      var padL = mainEl ? getComputedStyle(mainEl).paddingLeft : '1rem';
      var padR = mainEl ? getComputedStyle(mainEl).paddingRight : '1rem';

      var inner = document.createElement('div');
      inner.style.cssText = [
        'max-width:80rem',
        'margin:0 auto',
        'padding-left:' + padL,
        'padding-right:' + padR,
        'padding-bottom:4px',
        'display:flex',
        'flex-direction:column',
        'gap:4px',
      ].join(';');

      // chain[0] = メインクローン（サブより前面に描画 z-index:1）
      // chain[1+] = サブクローン（data-sub-wrap にまとめ、メインの裏に押し上げ可能）
      var subWrapRef = null;
      chain.forEach(function (sec, idx) {
        var block = cloneBtn(sec);
        if (!block) return;
        (function (sEl, bl) {
          bl.addEventListener('click', function () {
            closeSection(sEl);
            setTimeout(function () {
              var hdr = sEl.querySelector(':scope > button');
              if (hdr) {
                var top = hdr.getBoundingClientRect().top + window.scrollY - (NAV_H + 8);
                window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
              }
              stickyWrap.dataset.activeKey = '';
              updateBar();
            }, 160);
          });
        })(sec, block);

        if (idx === 0) {
          // メインクローン: z-index を上げてサブが裏に潜れるようにする
          block.style.position = 'relative';
          block.style.zIndex = '1';
          inner.appendChild(block);
        } else {
          // サブクローン: data-sub-wrap にまとめる
          if (!subWrapRef) {
            subWrapRef = document.createElement('div');
            subWrapRef.setAttribute('data-sub-wrap', '');
            subWrapRef.style.cssText = 'display:flex;flex-direction:column;gap:4px;position:relative;z-index:0;';
            inner.appendChild(subWrapRef);
          }
          subWrapRef.appendChild(block);
        }
      });

      stickyWrap.innerHTML = '';
      stickyWrap.appendChild(inner);
    }

    // ① メイン兄弟セクションによってバー全体をナビ裏に押し上げる
    var chainRoot = chain[0];
    var topSiblings = chainRoot.parentElement
      ? Array.from(chainRoot.parentElement.querySelectorAll(':scope > section[data-section-title]'))
      : [];
    var topSibIdx = topSiblings.indexOf(chainRoot);
    if (topSibIdx !== -1 && topSibIdx + 1 < topSiblings.length) {
      var nextTopBtn = topSiblings[topSibIdx + 1].querySelector(':scope > button');
      if (nextTopBtn) {
        var stickyH = stickyWrap.offsetHeight;
        var topTriggerY = NAV_H + stickyH + 8;
        var nextTopTop = nextTopBtn.getBoundingClientRect().top;
        if (nextTopTop < topTriggerY) {
          var topPushPx = Math.min(topTriggerY - nextTopTop, stickyH);
          var swTopReset = stickyWrap.querySelector('[data-sub-wrap]');
          if (swTopReset) swTopReset.style.transform = '';
          stickyWrap.style.transition = 'none';
          stickyWrap.style.transform = 'translateY(-' + topPushPx + 'px)';
          stickyWrap.style.opacity = '1';
          stickyWrap.style.pointerEvents = topPushPx > 0 ? 'none' : 'auto';
          return;
        }
      }
    }

    // ② サブ兄弟セクションによってサブクローンのみをメインクローンの裏に押し上げる
    if (chain.length >= 2) {
      var chainLeaf = chain[chain.length - 1];
      var leafSiblings = chainLeaf.parentElement
        ? Array.from(chainLeaf.parentElement.querySelectorAll(':scope > section[data-section-title]'))
        : [];
      var leafSibIdx = leafSiblings.indexOf(chainLeaf);
      if (leafSibIdx !== -1 && leafSibIdx + 1 < leafSiblings.length) {
        var nextLeafBtn = leafSiblings[leafSibIdx + 1].querySelector(':scope > button');
        var subWrapEl = stickyWrap.querySelector('[data-sub-wrap]');
        if (nextLeafBtn && subWrapEl) {
          var subH = subWrapEl.offsetHeight;
          // サブラップ底辺 ≈ NAV_H + stickyH - padding(4px)、バッファ 8px
          var leafTriggerY = NAV_H + stickyWrap.offsetHeight + 4;
          var nextLeafTop = nextLeafBtn.getBoundingClientRect().top;
          if (nextLeafTop < leafTriggerY) {
            // subH + 4px 押し上げるとメインクローンの裏に完全に隠れる
            var leafPushPx = Math.min(leafTriggerY - nextLeafTop, subH + 4);
            subWrapEl.style.transition = 'none';
            subWrapEl.style.transform = 'translateY(-' + leafPushPx + 'px)';
            stickyWrap.style.transition = 'none';
            stickyWrap.style.transform = 'translateY(0)';
            stickyWrap.style.opacity = '1';
            stickyWrap.style.pointerEvents = 'auto';
            return;
          }
        }
      }
    }

    // サブラップのトランスフォームをリセットしてから表示
    var swFinalReset = stickyWrap.querySelector('[data-sub-wrap]');
    if (swFinalReset) swFinalReset.style.transform = '';
    show();  // sticky演出: 瞬時表示
  }

  document.addEventListener('alpine:initialized', function () {
    createWrap();
    window.addEventListener('scroll', updateBar, { passive: true });
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('section[data-section-title] > button');
      if (btn) setTimeout(updateBar, 280);
    });
    updateBar();
  });
}());
</script>

<!-- アンカーリンク処理: #article-xxx クリック時にトグルを開いてスムーズスクロール -->
<script>
(function () {
  // ソートタブ（x-show="sort==='xxx'"）内の要素なら該当タブに切り替える
  function activateSortTab(el) {
    var sortTab = el.closest('[x-show^="sort==="]');
    if (!sortTab || !window.Alpine) return;
    var m = sortTab.getAttribute('x-show').match(/sort==='(\w+)'/);
    if (!m) return;
    var section = sortTab.closest('[x-data]');
    if (section) {
      try { Alpine.$data(section).sort = m[1]; } catch (e) {}
    }
  }

  // ID重複対応: 同一IDが複数ある場合（GitHub Trending の各ソートタブなど）
  // ソートタブ外 → 現在アクティブなソートタブ内 → 最初の候補の順で選択
  function findBestTarget(hash) {
    var id = hash.replace('#', '');
    var candidates = document.querySelectorAll('[id="' + CSS.escape(id) + '"]');
    if (candidates.length === 0) return null;
    if (candidates.length === 1) return candidates[0];

    // ソートタブ外の候補を優先
    for (var i = 0; i < candidates.length; i++) {
      if (!candidates[i].closest('[x-show^="sort==="]')) return candidates[i];
    }
    // 現在アクティブなソートタブ内の候補を優先
    for (var i = 0; i < candidates.length; i++) {
      var tab = candidates[i].closest('[x-show^="sort==="]');
      if (tab && tab.style.display !== 'none') return candidates[i];
    }
    // どれも非表示なら最初の候補（ソートタブを切り替えて表示する）
    return candidates[0];
  }

  function openAndScrollTo(hash) {
    if (!hash || !hash.startsWith('#article-')) return;
    var target = findBestTarget(hash);
    if (!target) return;

    // 祖先の Alpine x-data で open プロパティを持つ要素を収集（内→外）
    var ancestors = [];
    var el = target.parentElement;
    while (el && el !== document.documentElement) {
      if (el.hasAttribute('x-data') && window.Alpine) {
        try {
          var data = Alpine.$data(el);
          if (data && typeof data.open !== 'undefined') {
            ancestors.push(el);
          }
        } catch (e) {}
      }
      el = el.parentElement;
    }

    // 外側から内側の順で open = true（外側を先に開かないと内側が表示されない）
    ancestors.slice().reverse().forEach(function (anc) {
      try { Alpine.$data(anc).open = true; } catch (e) {}
    });

    // ソートタブ切り替え（GitHub Trending の Daily/Weekly/Monthly/Total）
    activateSortTab(target);

    // スクロールオフセット: ナビ高さ + 記事が属するセクション階層のスティッキーバー高さ
    // （例: AI企業動向 + 自社発表 の2段が表示される場合はその合計）
    var NAV_H_SCROLL = 52;
    var stickyOffset = NAV_H_SCROLL;
    var sectionStack = [];
    var sp = target.parentElement;
    while (sp && sp !== document.documentElement) {
      if (sp.tagName === 'SECTION' && sp.hasAttribute('data-section-title')) {
        sectionStack.push(sp);
      }
      sp = sp.parentElement;
    }
    // innermost-first → outermost-first に並び替えてボタン高さを合計
    sectionStack.reverse().forEach(function (sec, idx) {
      var btn = sec.querySelector(':scope > button');
      if (btn) {
        if (idx > 0) stickyOffset += 4; // クローン間の gap 4px
        stickyOffset += btn.offsetHeight;
      }
    });
    stickyOffset += sectionStack.length >= 2 ? 40 : 8; // サブあり: 大きめ余白、なし: 小さめ

    // 要素が表示されるまで待ってからスクロール（x-show トランジション完了を待つ）
    var maxWait = 2000;
    var start = Date.now();
    (function waitAndScroll() {
      if (target.offsetHeight > 0) {
        var top = target.getBoundingClientRect().top + window.scrollY - stickyOffset;
        window.scrollTo({ top: top, behavior: 'smooth' });
      } else if (Date.now() - start < maxWait) {
        requestAnimationFrame(waitAndScroll);
      }
    })();
  }

  document.addEventListener('alpine:initialized', function () {
    // ページロード時に hash があれば処理
    if (window.location.hash.startsWith('#article-')) {
      setTimeout(function () { openAndScrollTo(window.location.hash); }, 150);
    }

    // 同ページ内 #article- リンクのクリックを横取り
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[href^="#article-"]');
      if (!a) return;
      e.preventDefault();
      var hash = a.getAttribute('href');
      history.pushState(null, '', hash);
      openAndScrollTo(hash);
    });
  });
}());
</script>

<!-- フローティングボタン群 -->
<div id="fab-group" class="fixed bottom-6 right-6 z-50 flex flex-col items-center gap-2 transition-all duration-300">
  <!-- チャット呼び出しFAB（スクロール時 + チャット未表示時のみ） -->
  <button id="fab-chat"
          style="display:none"
          title="今日のチャットを開く"
          class="w-11 h-11 rounded-full bg-blue-600 text-white shadow-lg flex items-center justify-center hover:bg-blue-700 active:scale-95 transition-all duration-150">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    </svg>
  </button>
  <!-- ページトップに戻るボタン -->
  <button id="back-to-top"
          onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
          title="ページトップに戻る"
          style="display:none"
          class="w-11 h-11 rounded-full bg-slate-700 text-white shadow-lg flex items-center justify-center hover:bg-slate-600 active:scale-95 transition-all duration-150">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
    </svg>
  </button>
</div>
<script>
(function(){
  var fabGroup = document.getElementById('fab-group');
  var btnTop = document.getElementById('back-to-top');
  var fabChat = document.getElementById('fab-chat');

  // チャットFABクリック: Alpine store のtoggleを呼ぶ
  fabChat.addEventListener('click', function() {
    if (window.Alpine && Alpine.store('dailyChat')) {
      var dateStr = Alpine.store('dailyChat').dateStr;
      if (!dateStr) {
        var sel = document.querySelector('select[onchange*="archive"]');
        if (sel) dateStr = sel.value;
      }
      if (dateStr) Alpine.store('dailyChat').toggle(dateStr);
    }
  });

  function updateFabs() {
    var scrolled = window.scrollY > 200;

    // チャットパネルが開いているか
    var chatOpen = window.Alpine && Alpine.store('dailyChat') && Alpine.store('dailyChat').open;
    // モバイル（lg未満）でチャットが開いている場合はFABを全て非表示
    var mobileChat = chatOpen && window.innerWidth < 1024;

    btnTop.style.display = (scrolled && !mobileChat) ? 'flex' : 'none';

    // チャットFAB: スクロール済み + チャット未表示時のみ
    fabChat.style.display = (scrolled && !chatOpen) ? 'flex' : 'none';

    // FABグループの位置: 広い画面でチャット開いている時は左にずらす
    if (chatOpen && window.innerWidth >= 1024) {
      fabGroup.style.right = 'calc(420px + 1.5rem)';
    } else {
      fabGroup.style.right = '1.5rem';
    }
  }

  window.addEventListener('scroll', updateFabs, {passive: true});
  // Alpine storeの変更を監視
  document.addEventListener('alpine:initialized', function() {
    Alpine.effect(updateFabs);
  });
}());
</script>

<script src="/static/js/chat.js"></script>
</body>
</html>
