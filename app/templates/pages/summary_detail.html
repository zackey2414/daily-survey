{% extends "base.html" %}
{% block title %}{{ date_str }} まとめ — AI Daily Survey{% endblock %}

{% block content %}
<div class="mb-4 flex items-center gap-3">
  <a href="/summaries" class="text-blue-600 hover:underline text-sm">← まとめ履歴</a>
  <span class="text-gray-300">|</span>
  <a href="/archive/{{ date_str }}" class="text-blue-600 hover:underline text-sm">
    {{ date_str }} の記事一覧 →
  </a>
</div>

<article class="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden">
  <div class="flex items-center gap-3 px-5 sm:px-6 py-4"
       style="background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);">
    <span class="text-xl bg-white/15 p-2 rounded-xl leading-none">📋</span>
    <h1 class="text-lg font-bold text-white tracking-tight">{{ date_str }} AI 動向まとめ</h1>
  </div>
  <div class="px-4 sm:px-6 py-5 sm:py-6 prose max-w-none text-gray-800">
    {{ content_html | safe }}
  </div>
</article>
{% endblock %}
