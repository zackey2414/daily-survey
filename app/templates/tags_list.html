{% extends "base.html" %}
{% block title %}タグ一覧 — AI Daily Survey{% endblock %}

{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-bold text-gray-800">🏷️ タグ一覧</h1>
  <p class="text-gray-500 text-sm mt-1">全 {{ tags|length }} タグ（出現回数降順）</p>
</div>

{% if tags %}
<div class="bg-white rounded-2xl border shadow-sm p-6">
  <div class="flex flex-wrap gap-2">
    {% for tag, count in tags %}
    <a href="/tags/{{ tag }}"
       class="inline-flex items-center gap-1 bg-blue-50 text-blue-700 border border-blue-200
              px-3 py-1.5 rounded-full hover:bg-blue-100 transition text-sm font-medium">
      #{{ tag }}
      <span class="text-xs text-blue-400 bg-white border border-blue-200 px-1.5 py-0.5 rounded-full">
        {{ count }}
      </span>
    </a>
    {% endfor %}
  </div>
</div>
{% else %}
<div class="text-center py-16 text-gray-400">
  <p class="text-4xl mb-4">🏷️</p>
  <p>まだタグがありません。記事の収集後に表示されます。</p>
</div>
{% endif %}
{% endblock %}
